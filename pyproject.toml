[tool.poetry]
name = "polars_expr_transformer"
version = "0.6.2"
description = "Transform string-based expressions into Polars DataFrame operations"
authors = ["Edward van Eehoud <evaneechoudl@gmail.com>"]
readme = "README.md"
repository = "https://github.com/edwardvaneechoud/polars_expr_transformer"

packages = [
    { include = "polars_expr_transformer", from = "." },
]

include = [
    "polars_expr_transformer/funcs/*.py"
]

[tool.poetry.dependencies]
python = ">=3.10"
polars = ">1.8.2,<2.0.0"
pydantic = ">=2.9.2"
# Optional: only needed for string-similarity functions. polars-ds ships no
# WebAssembly wheel, so it must stay optional for browser/Pyodide installs.
polars-ds = { version = ">=0.6.0", optional = true }

[tool.poetry.extras]
similarity = ["polars-ds"]

[tool.poetry.group.dev.dependencies]
# polars-ds is optional for end users (the `similarity` extra), but the test
# suite exercises string_similarity() and must never silently skip it, so the
# dev environment always installs it.
polars-ds = ">=0.6.0"
pytest = "~7.4.0"
check-manifest = "^0.46"
flake8 = "^3.9.2"
coverage = "^6.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
